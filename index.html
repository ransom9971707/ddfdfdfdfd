<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STREETZ ✦ MY NYC ARCHIVE</title>
  <style>
    /* Dark aesthetic to match Kimi's original framing style */
    body {
      background-color: #000;
      color: #fff;
      font-family: monospace;
      margin: 0;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    h1 {
      letter-spacing: 2px;
      margin-bottom: 5px;
    }
    
    /* Upload Panel Styling */
    #upload-panel {
      padding: 20px;
      border: 1px dashed #333;
      margin: 20px auto 40px auto;
      max-width: 600px;
      background: #0a0a0a;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #888;
      font-size: 12px;
      text-transform: uppercase;
    }
    .form-group input[type="text"], .form-group select {
      width: 100%;
      padding: 10px;
      background: #111;
      color: #fff;
      border: 1px solid #333;
      box-sizing: border-box;
      font-family: monospace;
    }
    #submitPhotoBtn {
      background: #fff;
      color: #000;
      border: none;
      padding: 12px 24px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      font-family: monospace;
      width: 100%;
    }
    #submitPhotoBtn:hover {
      background: #ccc;
    }

    /* Core Dynamic Wall Grid Layout */
    .THE-WALL {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 0;
    }
    
    /* Wall Elements styling */
    .wall-frame {
      border: 1px solid #1a1a1a;
      padding: 15px;
      background: #050505;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .uploader-tag {
      font-size: 11px;
      color: #ff3e3e; /* Distinct color for attribution */
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      border-bottom: 1px solid #111;
      padding-bottom: 5px;
    }
    .photo-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      filter: grayscale(10%);
    }
    .caption-tag {
      font-size: 13px;
      margin-top: 12px;
      color: #aaa;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <header>
    <h1>STREETZ ✦ MY NYC ARCHIVE</h1>
    <p>shot on the streets ✦ open source timeline ✦ nyc forever</p>
  </header>

  <!-- MULTI-INPUT UPLOAD INTERFACE -->
  <div id="upload-panel">
    <h3 style="margin-top: 0; letter-spacing: 1px; text-transform: uppercase; font-size: 14px; border-bottom: 1px solid #222; padding-bottom: 10px;">✦ Paste a Slide onto the Wall</h3>
    
    <div class="form-group">
      <label>1. Who is catching this frame? (Your Name)</label>
      <input type="text" id="uploaderInput" placeholder="anonymous user...">
    </div>

    <div class="form-group">
      <label>2. Select Asset File</label>
      <input type="file" id="fileInput" accept="image/*" style="color: #888;">
    </div>
    
    <div class="form-group">
      <label>3. Caption / Thought State</label>
      <input type="text" id="captionInput" placeholder="e.g., lower east side, running out of film...">
    </div>
    
    <div class="form-group">
      <label>4. Frame Format Aspect</label>
      <select id="sizeInput">
        <option value="w-wide">Wide Landscape (w-wide)</option>
        <option value="w-tall">Tall Portrait (w-tall)</option>
      </select>
    </div>

    <button id="submitPhotoBtn">Post Frame Live</button>
    <div id="formFeedback" style="margin-top: 10px; color: #00ff00; font-size: 12px; text-align: center;"></div>
  </div>

  <h2 style="text-align: center; font-weight: normal; letter-spacing: 3px; font-size: 16px; margin-top: 60px; color: #666;">THE WALL ✦ CHRONOLOGICAL ENTRIES</h2>

  <!-- DYNAMIC RENDER BLOCK GRID -->
  <div id="wall-grid" class="THE-WALL"></div>

  <script>
    // 1. Core Default Hardcoded Kimi Array Configurations
    const DEFAULT_PHOTOS = [
      {src:"pics/1_Vibrant_Nighttime_Photos_of_Times.png",      cap:"times sq at 2am, no thoughts",        size:"w-wide", by:"KIMI AI ARCHIVE"},
      {src:"pics/2_Busy_People_Walking_on_Brooklyn_Bridge.png", cap:"golden hour >>> everything else",     size:"w-tall", by:"KIMI AI ARCHIVE"},
      {src:"pics/3_75_800_New_York_City_Lights_Stock.png",      cap:"neon drowned, didn't wanna be saved", size:"w-wide", by:"KIMI AI ARCHIVE"},
      {src:"pics/4_New_York_City_Photography_Guide_Best.png",   cap:"the city said pose",                  size:"w-tall", by:"KIMI AI ARCHIVE"},
      {src:"pics/1_Roaming_SoHo_With_New_York_s_Stylish.png",   cap:"soho fits check ✔",                   size:"w-wide", by:"KIMI AI ARCHIVE"},
      {src:"pics/3_Golden_hour_at_The_Brooklyn_Bridge.png",     cap:"walked the bridge, found peace",      size:"w-tall", by:"KIMI AI ARCHIVE"},
      {src:"pics/2_110_New_York_City_Urban_Vibe_Stock.png",     cap:"little italy hits different",         size:"w-wide", by:"KIMI AI ARCHIVE"},
      {src:"pics/4_NYC_Style_Diary_The_Streets_of_Soho.png",    cap:"main character energy",               size:"w-tall", by:"KIMI AI ARCHIVE"},
    ];

    // 2. State Controller: Sync Memory across storage pipelines
    let savedPhotos = JSON.parse(localStorage.getItem('my_archive_photos'));
    if (!savedPhotos || savedPhotos.length === 0) {
      savedPhotos = DEFAULT_PHOTOS;
      localStorage.setItem('my_archive_photos', JSON.stringify(savedPhotos));
    }

    // 3. Unlimited Rendering loop engine
    function renderWall() {
      const wallGrid = document.getElementById('wall-grid');
      if (!wallGrid) return;
      
      // Wipe the container to safely rewrite array components cleanly
      wallGrid.innerHTML = ''; 

      savedPhotos.forEach(photo => {
        const frame = document.createElement('div');
        frame.className = `wall-frame ${photo.size || 'w-wide'}`; 
        
        // Assembled HTML containing user metadata + photo layout
        frame.innerHTML = `
          <div>
            <div class="uploader-tag">✦ CAPTURED BY: ${photo.by || 'ANONYMOUS'}</div>
            <div class="photo-wrapper">
              <img src="${photo.src}" alt="${photo.cap}">
            </div>
          </div>
          <div class="caption-tag">“ ${photo.cap} ”</div>
        `;
        wallGrid.appendChild(frame);
      });
    }

    // 4. Form Submission tracking runtime
    document.getElementById('submitPhotoBtn').addEventListener('click', function() {
      const uploaderInput = document.getElementById('uploaderInput');
      const fileInput = document.getElementById('fileInput');
      const captionInput = document.getElementById('captionInput');
      const sizeInput = document.getElementById('sizeInput');
      const feedback = document.getElementById('formFeedback');

      // Validations
      if (!fileInput.files || fileInput.files.length === 0) {
        alert("Please map an image asset file to post.");
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();

      feedback.textContent = "Developing submission onto block standard...";

      reader.onload = function(event) {
        const base64Image = event.target.result;
        
        // Generate payload combining text values + user name metrics
        const newPhoto = {
          src: base64Image,
          by: uploaderInput.value.trim().toUpperCase() || "ANONYMOUS UNIT",
          cap: captionInput.value.trim() || "uncaptioned timestamp frame",
          size: sizeInput.value
        };

        // Inject new content to the top position array layout
        savedPhotos.unshift(newPhoto);

        // Store configuration snapshot persistently inside the client machine state
        localStorage.setItem('my_archive_photos', JSON.stringify(savedPhotos));

        // Execute structural frame update on-demand
        renderWall();

        // Reset system entry configurations
        fileInput.value = '';
        captionInput.value = '';
        uploaderInput.value = '';
        feedback.textContent = "POSTED SUCCESSFUL! REFRESH TO TEST PERSISTENCE.";
        setTimeout(() => { feedback.textContent = ''; }, 4000);
      };

      // Read target binary configurations into browser engine format strings
      reader.readAsDataURL(file);
    });

    // Execute baseline view mapping instantly
    renderWall();
  </script>
</body>
</html>
